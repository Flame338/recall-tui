[package]
name = "recall"
version = "0.1.0"
edition = "2024"
description = "A local project memory TUI powered by LuxCore"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
libloading = "0.8"
ignore = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Security",
] }
